{s:7, topic:"Multidimensional icons", type:"sa",
 prompt:"Which statements about multidimensional icons, such as Chernoff faces, StarCursor, or the real-estate icons of Spence and Parr, are true? Select all that apply.",
 opts:[
  {t:"They can be customized for a different task and domain", c:true},
  {t:"A Chernoff face represents k dimensions in a single face", c:true},
  {t:"Each object appears as one coherent visual entity (object visibility)", c:true},
  {t:"They make it easy to compare one attribute across all objects", n:"That's attribute visibility, a strength of parallel coordinates. Icons favor whole objects."},
  {t:"Spence and Parr found icons slowed dwelling selection compared with text", n:"Their experiment found the task was completed twice as fast with icons."}],
 why:"Multidimensional icons encode many attributes in one glyph and can be tailored to a domain: houses whose windows encode repair and whose green area encodes garden size. Each object is a single entity, which gives object visibility. Spence and Parr found choosing among 56 dwellings took half the time with icons."}
];
Q.forEach((q,i)=>q.id=i);

const TYPE_LABEL = {mc:"Multiple choice", tf:"True / false", sa:"Select all that apply"};
const $ = s => document.querySelector(s);
const stage = $('#stage');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffleArr = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sectionOf = id => SECTIONS[id-1];

const S = {
  shuffle:false, round:'main', queue:[], pos:0, phase:null,
  correct:0, incorrect:0, log:{}, orders:{}, seen:new Set(),
  misses:{}, mainLog:null
};

function announce(msg){ const a=$('#announce'); a.textContent=''; setTimeout(()=>a.textContent=msg,30); }

/* ---------- Rounds ---------- */
function startRound(kind, ids){
  S.round = kind;
  S.queue = ids.slice().sort((a,b)=>a-b);
  if (S.shuffle) shuffleArr(S.queue);
  S.pos = 0; S.correct = 0; S.incorrect = 0; S.log = {}; S.orders = {};
  S.seen = new Set(kind === 'main' ? [] : SECTIONS.map(s=>s.id));
  $('#roundLabel').textContent = kind === 'main' ? 'Main round' : 'Remediation round';
  updateDash(); drawTicks(); show();
}

function show(){
  if (S.pos >= S.queue.length) return renderSummary();
  const q = Q[S.queue[S.pos]];
  if (!S.seen.has(q.s)) { S.phase = 'intro'; return renderIntro(q.s); }
  S.phase = 'question'; renderQuestion(q);
}

function focusEl(el){ if (el) { el.focus({preventScroll:true}); el.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); } }
function scrollTopStage(){ window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }

/* ---------- Section intro ---------- */
function renderIntro(sid){
  const sec = sectionOf(sid);
  const n = Q.filter(q=>q.s===sid).length;
  const note = S.shuffle ? 'Shuffle is on: questions from this section are mixed with the others.' : `${n} questions in this section`;
  stage.innerHTML = `<article class="card intro" aria-labelledby="introH">
    <div class="meta"><span class="badge">Section ${sid}</span><span class="qtype">Section ${sid} of ${SECTIONS.length}</span></div>
    <h2 id="introH" tabindex="-1">${esc(sec.name)}</h2>
    <p class="lede">${esc(sec.intro)}</p>
    <h3 class="sr-only">Key terms</h3>
    <ul class="chips">${sec.terms.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <p class="count">${note}</p>
    <button type="button" class="btn primary" id="beginBtn">Start section</button>
  </article>`;
  $('#beginBtn').addEventListener('click', ()=>{ S.seen.add(sid); show(); });
  scrollTopStage(); focusEl($('#introH'));
}

/* ---------- Question ---------- */
function renderQuestion(q){
  const sec = sectionOf(q.s);
  if (!S.orders[q.id]) {
    const idx = q.opts.map((_,i)=>i);
    S.orders[q.id] = q.type === 'tf' ? idx : shuffleArr(idx);
  }
  const inputType = q.type === 'sa' ? 'checkbox' : 'radio';
  const optsHtml = S.orders[q.id].map(i => `
    <label class="opt" data-i="${i}">
      <input type="${inputType}" name="ans" value="${i}">
      <span class="opt-text">${esc(q.opts[i].t)}</span>
      <span class="tag" hidden></span>
    </label>`).join('');
  stage.innerHTML = `<article class="card" aria-labelledby="qnum">
    <div class="meta">
      <span class="badge" title="${esc(sec.name)}">Section ${q.s}</span>
      <span class="topic">${esc(q.topic)}</span>
      <span class="qtype">${TYPE_LABEL[q.type]}</span>
    </div>
    <h2 class="qnum" id="qnum" tabindex="-1">Question ${S.pos+1} of ${S.queue.length}<span class="sr-only">, ${esc(sec.name)}, ${TYPE_LABEL[q.type]}</span></h2>
    ${q.ctx ? `<figure class="ctx"><figcaption>Reference</figcaption>${q.ctx}</figure>` : ''}
    <form id="qform" novalidate>
      <fieldset>
        <legend class="prompt">${esc(q.prompt)}</legend>
        <div class="opts">${optsHtml}</div>
      </fieldset>
      ${q.type==='sa' ? '<p class="hint">Select every option that applies, then check your answer.</p>' : ''}
      <div class="actions"><button type="submit" class="btn primary" id="checkBtn" disabled>Check answer</button></div>
    </form>
    <div id="fb"></div>
  </article>`;
  const form = $('#qform');
  form.addEventListener('change', ()=>{ $('#checkBtn').disabled = !form.querySelector('input:checked'); });
  form.addEventListener('submit', e=>{ e.preventDefault(); grade(q); });
  scrollTopStage(); focusEl($('#qnum'));
}

function grade(q){
  const form = $('#qform');
  const chosen = [...form.querySelectorAll('input:checked')].map(i=>+i.value);
  if (!chosen.length) return;
  const right = q.opts.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const ok = chosen.length === right.length && chosen.every(i=>right.includes(i));
  S.log[q.id] = {chosen, ok};
  if (ok) S.correct++; else { S.incorrect++; S.misses[q.topic] = S.misses[q.topic] || {n:0, s:q.s}; S.misses[q.topic].n++; }
  S.phase = 'feedback';

  form.classList.add('locked');
  form.querySelectorAll('input').forEach(i=>i.disabled=true);
  $('#checkBtn').remove();
  form.querySelectorAll('.opt').forEach(lab=>{
    const i = +lab.dataset.i, isC = q.opts[i].c, picked = chosen.includes(i), tag = lab.querySelector('.tag');
    let state = 'dim', text = '';
    if (isC && picked) { state='correct'; text='✓ Correct'; }
    else if (isC) { state='missed'; text = q.type==='sa' ? '✓ Also correct' : '✓ Correct answer'; }
    else if (picked) { state='wrong'; text='✗ Your choice'; }
    lab.dataset.state = state;
    if (text) { tag.textContent = text; tag.hidden = false; }
  });

  const correctTexts = right.map(i=>`“${esc(q.opts[i].t)}”`);
  let misc = '';
  if (!ok) {
    const items = [];
    chosen.filter(i=>!q.opts[i].c).forEach(i=>items.push(`<li><strong>You chose “${esc(q.opts[i].t)}”.</strong> ${esc(q.opts[i].n || 'This option is not correct.')}</li>`));
    if (q.type==='sa') right.filter(i=>!chosen.includes(i)).forEach(i=>items.push(`<li><strong>You left out “${esc(q.opts[i].t)}”.</strong> ${esc(q.opts[i].n || 'This is also correct; the explanation below covers why.')}</li>`));
    const hasWrong = chosen.some(i=>!q.opts[i].c);
    misc = `<h4>${hasWrong ? 'Misconception to correct' : 'What you missed'}</h4><ul>${items.join('')}</ul>`;
  }
  const last = S.pos === S.queue.length - 1;
  $('#fb').innerHTML = `<section class="feedback ${ok?'ok':'bad'}" id="fbBox" tabindex="-1" aria-labelledby="fbH">
    <h3 id="fbH">${ok ? '✓ Correct' : '✗ Incorrect'}</h3>
    <p class="answer-line">${right.length>1?'Correct answers':'Correct answer'}: <b>${correctTexts.join(', ')}</b></p>
    ${misc}
    <h4>Why</h4><p>${esc(q.why)}</p>
    <div class="actions"><button type="button" class="btn primary" id="nextBtn">${last ? 'See results' : 'Next question'}</button></div>
  </section>`;
  $('#nextBtn').addEventListener('click', ()=>{ S.pos++; show(); });
  updateDash(); updateDeficits();
  announce(ok ? 'Correct.' : 'Incorrect. Feedback follows.');
  focusEl($('#fbBox'));
}

/* ---------- Dashboard ---------- */
function updateDash(){
  const answered = S.correct + S.incorrect, total = S.queue.length;
  $('#dCorrect').textContent = S.correct;
  $('#dIncorrect').textContent = S.incorrect;
  $('#dScore').textContent = answered ? Math.round(100*S.correct/answered) + '%' : '–';
  $('#dRemaining').textContent = total - answered;
  const pct = total ? 100*answered/total : 0;
  $('#progressFill').style.width = pct + '%';
  const pb = $('#progress');
  pb.setAttribute('aria-valuemax', total); pb.setAttribute('aria-valuenow', answered);
  pb.setAttribute('aria-valuetext', `${answered} of ${total} answered`);
}

function drawTicks(){
  const t = $('#ticks'); t.innerHTML = '';
  if (S.shuffle || S.round !== 'main') return;
  let acc = 0;
  SECTIONS.slice(0,-1).forEach(sec=>{
    acc += Q.filter(q=>q.s===sec.id).length;
    const d = document.createElement('span'); d.className='tick'; d.style.left = (100*acc/Q.length)+'%'; t.appendChild(d);
  });
}

function updateDeficits(){
  const entries = Object.entries(S.misses).sort((a,b)=>b[1].n-a[1].n || a[1].s-b[1].s);
  const box = $('#deficits'), layout = $('#layout');
  if (!entries.length) { box.hidden = true; layout.classList.remove('has-deficits'); return; }
  box.hidden = false; layout.classList.add('has-deficits');
  const max = entries[0][1].n;
  $('#defList').innerHTML = entries.map(([topic,v])=>`<li class="def-row">
    <span>${esc(topic)}</span><span class="sec">Section ${v.s}: ${esc(sectionOf(v.s).name)}</span>
    <span class="n" aria-label="missed ${v.n} ${v.n===1?'time':'times'}">×${v.n}</span>
    <span class="bar" aria-hidden="true"><span style="width:${100*v.n/max}%"></span></span></li>`).join('');
}

/* ---------- Summary ---------- */
function renderSummary(){
  S.phase = 'summary';
  const ids = S.queue.slice();
  const total = ids.length, pct = total ? Math.round(100*S.correct/total) : 0;
  const missedIds = ids.filter(id=>!S.log[id].ok).sort((a,b)=>a-b);
  const secIds = [...new Set(ids.map(id=>Q[id].s))].sort((a,b)=>a-b);
  const bars = secIds.map(sid=>{
    const inSec = ids.filter(id=>Q[id].s===sid), c = inSec.filter(id=>S.log[id].ok).length;
    const p = Math.round(100*c/inSec.length);
    return `<li class="secbar ${c===inSec.length?'full':''}"><span>Section ${sid}: ${esc(sectionOf(sid).name)}</span><span class="frac">${c}/${inSec.length} · ${p}%</span>
      <span class="bar" role="img" aria-label="${p} percent correct"><span style="width:0" data-w="${p}"></span></span></li>`;
  }).join('');
  const optText = (q,list)=> list.map(i=>`“${esc(q.opts[i].t)}”`).join(', ');
  const missed = missedIds.map(id=>{
    const q = Q[id], r = q.opts.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
    return `<li><div class="meta" style="margin:0"><span class="badge">Section ${q.s}</span><span class="topic">${esc(q.topic)}</span></div>
      <p class="mq">${esc(q.prompt)}</p>
      <dl><dt>Your answer</dt><dd class="yours">${optText(q,S.log[id].chosen)}</dd>
      <dt>Correct</dt><dd class="right">${optText(q,r)}</dd>
      <dt>Why</dt><dd>${esc(q.why)}</dd></dl></li>`;
  }).join('');
  const isMain = S.round === 'main';
  const title = isMain ? 'Module complete' : 'Remediation round complete';
  const remedLabel = isMain ? `Start remediation round (${missedIds.length})` : `Replay remaining misses (${missedIds.length})`;
  stage.innerHTML = `<article class="card summary" aria-labelledby="sumH">
    <h2 id="sumH" tabindex="-1">${title}</h2>
    <p class="bigscore">${pct}%</p>
    <p>${S.correct} of ${total} correct${isMain?'':' in this round'}.${missedIds.length?'':' Nothing left to remediate.'}</p>
    <div class="actions">
      ${missedIds.length ? `<button type="button" class="btn primary" id="remedBtn">${remedLabel}</button>` : ''}
      <button type="button" class="btn" id="restartBtn">Restart full module</button>
    </div>
    <h3>By section</h3>
    <ul class="secbars">${bars}</ul>
    <h3>${missedIds.length ? `Missed questions (${missedIds.length})` : 'Missed questions'}</h3>
    ${missedIds.length ? `<ol class="missed">${missed}</ol>` : '<p class="empty-note">You answered every question correctly.</p>'}
  </article>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.querySelectorAll('.secbar .bar span').forEach(s=>s.style.width=s.dataset.w+'%')));
  if (missedIds.length) $('#remedBtn').addEventListener('click', ()=>startRound('remed', missedIds));
  $('#restartBtn').addEventListener('click', ()=>{ S.misses = {}; updateDeficits(); startRound('main', Q.map(q=>q.id)); });
  announce(`${title}. Score ${pct} percent.`);
  scrollTopStage(); focusEl($('#sumH'));
}

/* ---------- Shuffle toggle ---------- */
$('#shuffleBtn').addEventListener('click', ()=>{
  S.shuffle = !S.shuffle;
  $('#shuffleBtn').setAttribute('aria-checked', String(S.shuffle));
  if (S.phase === 'summary' || S.phase === null) { drawTicks(); return; }
  const from = S.phase === 'feedback' ? S.pos + 1 : S.pos;
  const rest = S.queue.slice(from);
  if (S.shuffle) shuffleArr(rest); else rest.sort((a,b)=>a-b);
  S.queue = S.queue.slice(0, from).concat(rest);
  drawTicks();
  announce(S.shuffle ? 'Shuffle on. Remaining questions reordered.' : 'Shuffle off. Remaining questions back in section order.');
  if (S.phase !== 'feedback') show();
});

startRound('main', Q.map(q=>q.id));
</script>
</body></html>
